apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-worker
  namespace: fcg
  labels:
    app: payments-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payments-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # nunca derruba um pod antigo antes do novo estar Ready
      maxSurge: 1         # sobe 1 pod extra durante o rollout (total momentâneo: 3)
  template:
    metadata:
      labels:
        app: payments-worker
    spec:
      # ─── Aguarda RabbitMQ antes de iniciar o worker ───────────────────────
      initContainers:
        - name: wait-for-rabbitmq
          image: busybox:1.35
          command:
            - sh
            - -c
            - |
              until nc -z fcg-rabbitmq 5672; do
                echo "Aguardando RabbitMQ..."; sleep 3;
              done
              echo "RabbitMQ pronto!"

      containers:
        - name: payments-worker
          image: DOCKER_USERNAME/payments-worker-image:latest   # substituído pelo pipeline via kubectl set image
          imagePullPolicy: Always

          # ─── ConfigMap ─────────────────────────────────────────────────────
          envFrom:
            - configMapRef:
                name: payments-worker-config

          # ─── Secrets ───────────────────────────────────────────────────────
          env:
            - name: RabbitMQ__Username
              valueFrom:
                secretKeyRef:
                  name: payments-worker-secret
                  key: RabbitMQ__Username

            - name: RabbitMQ__Password
              valueFrom:
                secretKeyRef:
                  name: payments-worker-secret
                  key: RabbitMQ__Password

            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: payments-worker-secret
                  key: AWS_ACCESS_KEY_ID

            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: payments-worker-secret
                  key: AWS_SECRET_ACCESS_KEY

            - name: AWS_SESSION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: payments-worker-secret
                  key: AWS_SESSION_TOKEN

            - name: AWS_SQS_QUEUE_URL
              valueFrom:
                secretKeyRef:
                  name: payments-worker-secret
                  key: AWS_SQS_QUEUE_URL

          # ─── Recursos ──────────────────────────────────────────────────────
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          # ─── Health checks ─────────────────────────────────────────────────
          # Worker sem HTTP: usamos exec para verificar se o processo está vivo
          livenessProbe:
            exec:
              command:
                - pgrep
                - -f
                - FCG.Payments.EventProcessor.dll
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3

          readinessProbe:
            exec:
              command:
                - pgrep
                - -f
                - FCG.Payments.EventProcessor.dll
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3